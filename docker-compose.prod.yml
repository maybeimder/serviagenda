# Producción: compila el frontend y lo sirve con nginx (que redirige /api a la API).
#   docker compose -f docker-compose.prod.yml up --build      ->  http://localhost:8080
services:
  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
