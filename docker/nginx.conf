server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Guardar sesiones manda miles de registros en un solo PUT
    client_max_body_size 25m;

    # La API (servicio "api" de docker compose). Misma origen: no hace falta CORS.
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Archivos con hash en el nombre: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta (/people, /schedule, /coordinate) devuelve index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
